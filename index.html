      /* 移除原生视频控件 */

      }

      /* 背景图适配 */

      /* 右下角侧边菜单 (透明 + 层级修复) */

        background-color: rgba(255, 255, 255, 0.5) !important;
        backdrop-filter: blur(10px);
        z-index: 10000 !important;
      }
      .hope-ui-dark .hope-c-PJLV-ijgzmFG-css {
        background-color: rgba(0, 0, 0, 0.5) !important;
      }

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- 内容容器 -->
    <div id="root"></div>

    <!-- ================================================================= -->
    <!-- START: 美化脚本 (Beautifier) -->
    <!-- ================================================================= -->
    <style>
      .hope-ui-light,
      .hope-ui-dark {
        --hope-colors-background: transparent;
      }
      .hope-c-PJLV-ifjOQLV-css {
        box-shadow: var(--hope-shadows-lg);
      }
      .hope-c-PJLV-ihWgyFw-css,
      .hope-c-PJLV-ibiABng-css {
        display: none;
      }
    </style>

    <script type="module">
      class Beautifier {
        static ignoredSelectors = [
          ".hope-tooltip",
          ".hope-tooltip__arrow",
          ".hope-checkbox__control",
          ".hope-modal__overlay",
          ".hope-select__option",
          ".monaco-editor",
          "button:not(.hope-menu__trigger)",
          "svg",
          // 忽略侧边栏
          ".hope-c-PJLV-ijgzmFG-css",
          // 忽略顶部导航栏
          ".header",
          ".hope-c-PJLV-ikaMhsQ-css",
          ".hope-breadcrumb",
        ];

        static getSelector(mainSelector) {
          return `${mainSelector} :not(${Beautifier.ignoredSelectors.join(
            "):not("
          )})`;
        }

        static lightSelector = Beautifier.getSelector(".hope-ui-light");
        static darkSelector = Beautifier.getSelector(".hope-ui-dark");
        static lightBgColor = "rgba(255, 255, 255, 0.8)";
        static darkBgColor = "rgb(32, 36, 37)";
        static specificPrefix = "rgba(132, 133, 141,";

        constructor() {
          this.observer = null;
        }

        #rewriteStyle(theme) {
          let selector =
            theme === "light"
              ? Beautifier.lightSelector
              : Beautifier.darkSelector;
          let bgColor =
            theme === "light"
              ? Beautifier.lightBgColor
              : Beautifier.darkBgColor;
          document.querySelectorAll(selector).forEach((element) => {
            const computedStyle = getComputedStyle(element);
            if (
              computedStyle.backgroundColor !== "rgba(0, 0, 0, 0)" &&
              !computedStyle.backgroundColor.startsWith(
                Beautifier.specificPrefix
              )
            ) {
              element.style.backgroundColor = bgColor;
              element.setAttribute("data-beautified", "true");
            }
          });
        }

        #beautify() {
          if (!location.pathname.startsWith("/@manage")) {
            this.#rewriteStyle("light");
            this.#rewriteStyle("dark");
          }
        }

        observe() {
          this.observer = new MutationObserver(this.#beautify.bind(this));
          this.observer.observe(document.body, {
            childList: true,
            subtree: true,
          });
          this.#beautify();
        }
        disconnect() {
          if (this.observer) this.observer.disconnect();
        }
        undo() {
          this.disconnect();
          document.body.querySelectorAll("[data-beautified]").forEach((element) => {
            element.style.backgroundColor = "";
            element.removeAttribute("data-beautified");
          });
        }
      }
      const beautifier = new Beautifier();
      window.beautifier = beautifier;
      beautifier.observe();
    </script>

    <script src="/src/main.tsx" type="module"></script>
  </body>
